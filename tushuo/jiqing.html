<h1>难忘的「激情」</h1>
<p class="date">2026.07.04</p>

<img src="images/jiqing.jpg" class="entry-img" alt="难忘的「激情」">

<p>
这张图很多人会很熟悉，里头的人物曾经红遍大江南北。2001年播出，初期反响平平。石钟山的小说有扎实的生活基础，最初的剧名叫《父亲进城》。陕西的民营公司投资，总政话剧团合作，大胡子张纪中慧眼识英雄，力推年轻无名的康洪雷执导。
</p>

<p>
全剧慢热型，因人物立体和生动的毛糙感被部分人诟病，但却得到了普通观众的热捧。石光荣及其一家人的形象深入人心，成为中国军旅剧的划时代标杆作品。有缺陷的活人出现在革命干部家庭里，作品能够公映且得到好评，是2001年的一大行业幸事。
</p>
