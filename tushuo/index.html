<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图说 | 漫游的梦想家</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Noto Serif SC', serif;
    background-color: #0B0D17;
    color: #E2E8F0;
    min-height: 100vh;
}

/* 顶部导航 */
.nav {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 10;
    padding: 20px 40px;
}

.nav a {
    color: rgba(226, 177, 60, 0.85);
    text-decoration: none;
    font-size: 0.95em;
    letter-spacing: 1px;
    transition: color 0.2s;
}

.nav a:hover {
    color: #E2B13C;
}

/* Banner 区域 */
.banner {
    position: relative;
    width: 100%;
    height: 70vh;
    min-height: 420px;
    overflow: hidden;
}

.banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
}

/* Banner 暗色遮罩 */
.banner-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to bottom,
        rgba(11, 13, 23, 0.3) 0%,
        rgba(11, 13, 23, 0.15) 50%,
        rgba(11, 13, 23, 0.65) 100%
    );
}

/* 「图说」大字 */
.banner-title {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(4rem, 10vw, 8rem);
    font-weight: 700;
    color: rgba(255, 255, 255, 0.82);
    letter-spacing: 0.25em;
    text-shadow:
        0 2px 20px rgba(0, 0, 0, 0.6),
        0 0 60px rgba(226, 177, 60, 0.15);
    white-space: nowrap;
    user-select: none;
}

/* 分隔线 */
.divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(to right, transparent, #E2B13C, transparent);
    margin: 48px auto;
}

/* 条目区域 */
.entries {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 30px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 32px;
}

/* 文章卡片 */
.entry {
    border: 1px solid rgba(226, 177, 60, 0.15);
    border-radius: 16px;
    overflow: hidden;
    transition: border-color 0.25s, transform 0.25s;
}

.entry:hover {
    border-color: rgba(226, 177, 60, 0.45);
    transform: translateY(-3px);
}

.entry a {
    display: block;
    text-decoration: none;
    color: inherit;
}

.entry-thumb {
    width: 100%;
    height: 200px;
    object-fit: cover;
    display: block;
}

.entry-info {
    padding: 16px 20px 20px;
    background: rgba(226, 177, 60, 0.04);
}

.entry-title {
    font-size: 1.05em;
    font-weight: 500;
    color: #E2E8F0;
    letter-spacing: 1px;
    margin-bottom: 8px;
    line-height: 1.5;
}

.entry-date {
    font-size: 0.78em;
    color: rgba(176, 137, 104, 0.8);
    letter-spacing: 1px;
}

.entries-placeholder {
    text-align: center;
    color: rgba(176, 137, 104, 0.5);
    font-size: 0.9em;
    letter-spacing: 2px;
    padding: 40px 0 80px;
}
</style>
</head>
<body>

<div class="banner">
    <img src="images/tushuo-banner.jpg" alt="图说签名墙">
    <div class="banner-overlay"></div>
    <nav class="nav">
        <a href="../index.html">← 返回首页</a>
    </nav>
    <div class="banner-title">图说</div>
</div>

<div class="divider"></div>

<div class="entries">
    <article class="entry">
        <a href="tuchuwei-1999.html">
            <img src="images/tuchuwei-1999.jpg" alt="世纪闪电" class="entry-thumb">
            <div class="entry-info">
                <p class="entry-title">世纪闪电</p>
                <p class="entry-date">2026.07.05</p>
            </div>
        </a>
    </article>
    <article class="entry">
        <a href="jiqing.html">
            <img src="images/jiqing.jpg" alt="难忘的「激情」" class="entry-thumb">
            <div class="entry-info">
                <p class="entry-title">难忘的「激情」</p>
                <p class="entry-date">2026.07.04</p>
            </div>
        </a>
    </article>
</div>

<footer style="text-align:center;padding:24px 0 16px;font-size:0.8em;color:#B08968;letter-spacing:1px;">
<span id="busuanzi_container_page_pv">本页阅读 <span id="busuanzi_value_page_pv"></span> 次</span>
</footer>
<script defer src="https://events.vercount.one/js"></script>

</body>
</html>
