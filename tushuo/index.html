<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>图说 | 漫游的梦想家</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;500;700&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Noto Serif SC', serif;
    background-color: #0B0D17;
    color: #E2E8F0;
    min-height: 100vh;
}

/* 顶部导航 */
.nav {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 10;
    padding: 20px 40px;
}

.nav a {
    color: rgba(226, 177, 60, 0.85);
    text-decoration: none;
    font-size: 0.95em;
    letter-spacing: 1px;
    transition: color 0.2s;
}

.nav a:hover {
    color: #E2B13C;
}

/* Banner 区域 */
.banner {
    position: relative;
    width: 100%;
    height: 70vh;
    min-height: 420px;
    overflow: hidden;
}

.banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
}

/* Banner 暗色遮罩 */
.banner-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to bottom,
        rgba(11, 13, 23, 0.3) 0%,
        rgba(11, 13, 23, 0.15) 50%,
        rgba(11, 13, 23, 0.65) 100%
    );
}

/* 「图说」大字 */
.banner-title {
    position: absolute;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    font-size: clamp(4rem, 10vw, 8rem);
    font-weight: 700;
    color: rgba(255, 255, 255, 0.82);
    letter-spacing: 0.25em;
    text-shadow:
        0 2px 20px rgba(0, 0, 0, 0.6),
        0 0 60px rgba(226, 177, 60, 0.15);
    white-space: nowrap;
    user-select: none;
}

/* 分隔线 */
.divider {
    width: 60px;
    height: 1px;
    background: linear-gradient(to right, transparent, #E2B13C, transparent);
    margin: 48px auto;
}

/* 条目区域 */
.entries {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 30px 80px;
}

.entries-placeholder {
    text-align: center;
    color: rgba(176, 137, 104, 0.5);
    font-size: 0.9em;
    letter-spacing: 2px;
    padding: 40px 0 80px;
}
</style>
</head>
<body>

<div class="banner">
    <img src="images/tushuo-banner.jpg" alt="图说签名墙">
    <div class="banner-overlay"></div>
    <nav class="nav">
        <a href="../index.html">← 返回首页</a>
    </nav>
    <div class="banner-title">图说</div>
</div>

<div class="divider"></div>

<div class="entries">
    <!-- 图文条目逐篇添加于此 -->
    <p class="entries-placeholder">· · ·</p>
</div>

<footer style="text-align:center;padding:24px 0 16px;font-size:0.8em;color:#B08968;letter-spacing:1px;">
<span id="busuanzi_container_page_pv">本页阅读 <span id="busuanzi_value_page_pv"></span> 次</span>
</footer>
<script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>

</body>
</html>
